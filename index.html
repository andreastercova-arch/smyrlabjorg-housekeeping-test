    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = "sine";
    osc1.frequency.setValueAtTime(587.33, now);
    gain1.gain.setValueAtTime(0.25, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.start(now);
    osc1.stop(now + 0.35);

    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = "sine";
    osc2.frequency.setValueAtTime(880, now + 0.12);
    gain2.gain.setValueAtTime(0.3, now + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start(now + 0.12);
    osc2.stop(now + 0.7);
  } catch (e) {
    console.warn("Audio chime prevented:", e);
  }
}

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
  }, 4500);
}

function setConnectionStatus(status) {
  const dot = document.getElementById("connDot");
  dot.className = "conn-dot " + status;
  if (status === "online") dot.title = "Connected to server";
  else if (status === "reconnecting") dot.title = "Reconnecting...";
  else dot.title = "Disconnected from server";
}

/* =====================================================
   LOGIN / PIN SYSTEM (PERMANENT LOGIN)
   ===================================================== */
function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById("dot-" + i);
    if (i < enteredPin.length) {
      dot.classList.add("filled");
    } else {
      dot.classList.remove("filled");
    }
  }
}

function pressPin(digit) {
  if (enteredPin.length < 4) {
    enteredPin += digit;
    updatePinDots();
    document.getElementById("loginError").textContent = "";

    if (enteredPin.length === 4) {
      setTimeout(verifyPin, 100);
    }
  }
}

function clearPin() {
  enteredPin = "";
  updatePinDots();
  document.getElementById("loginError").textContent = "";
}

function backspacePin() {
  if (enteredPin.length > 0) {
    enteredPin = enteredPin.slice(0, -1);
    updatePinDots();
    document.getElementById("loginError").textContent = "";
  }
}

document.addEventListener("keydown", (e) => {
  const overlay = document.getElementById("loginOverlay");
  if (overlay && overlay.style.display === "flex") {
    if (e.key >= "0" && e.key <= "9") {
      pressPin(e.key);
    } else if (e.key === "Backspace") {
      backspacePin();
    } else if (e.key === "Escape" || e.key === "c" || e.key === "C") {
      clearPin();
    }
  }
});

async function verifyPin() {
  document.getElementById("loginError").textContent = "Verifying...";

  const { data, error } = await window.supabaseClient
    .from("workers")
    .select("*")
    .eq("pin", enteredPin)
    .single();

  if (error || !data) {
    document.getElementById("loginError").textContent = "Incorrect PIN!";
    setTimeout(clearPin, 600);
    return;
  }

  currentWorker = data;
  localStorage.setItem("hk_worker", JSON.stringify(data));

  document.getElementById("loginOverlay").style.display = "none";
  updateUserHeader();
  await loadAttendance();
  await loadAssignments();
  render();
}

function checkSavedLogin() {
  const saved = localStorage.getItem("hk_worker");
  if (saved) {
    try {
      currentWorker = JSON.parse(saved);
      document.getElementById("loginOverlay").style.display = "none";
      updateUserHeader();
      return true;
    } catch(e) {
      localStorage.removeItem("hk_worker");
    }
  }
  document.getElementById("loginOverlay").style.display = "flex";
  return false;
}

function logout() {
  if (confirm("Are you sure you want to log out from this device?")) {
    localStorage.removeItem("hk_worker");
    currentWorker = null;
    enteredPin = "";
    updatePinDots();
    document.getElementById("loginOverlay").style.display = "flex";
    updateUserHeader();
    render();
  }
}

/* =====================================================
   SHIFTS & ATTENDANCE (CLEAN SLATE EVERY DAY)
   ===================================================== */
function isWorkerOnShift(workerName) {
  return todayAttendance.includes(workerName);
}

function isCurrentWorkerOnShift() {
  if (!currentWorker) return false;
  return isWorkerOnShift(currentWorker.name);
}

async function startShift() {
  if (!currentWorker) return;

  if (!todayAttendance.includes(currentWorker.name)) {
    todayAttendance.push(currentWorker.name);
  }
  updateUserHeader();
  render();

  await window.supabaseClient
    .from("worker_attendance")
    .upsert({
      date: getTodayString(),
      worker_name: currentWorker.name,
      logged_in_at: new Date().toISOString()
    }, { onConflict: "date,worker_name" });

  broadcastEvent("attendance_change", { worker: currentWorker.name, action: "start" });
  showToast(`🟢 Shift started! Have a great day.`);
}

async function endShift() {
  if (!currentWorker) return;
  if (!confirm("Are you sure you want to end today's shift?")) return;

  todayAttendance = todayAttendance.filter(w => w !== currentWorker.name);
  updateUserHeader();
  render();

  await window.supabaseClient
    .from("worker_attendance")
    .delete()
    .eq("date", getTodayString())
    .eq("worker_name", currentWorker.name);

  broadcastEvent("attendance_change", { worker: currentWorker.name, action: "end" });
  showToast(`Shift ended.`);
}

function updateUserHeader() {
  const badge = document.getElementById("currentUserBadge");
  const shiftContainer = document.getElementById("shiftControls");

  if (currentWorker) {
    let roleText = "";
    if (currentWorker.role === "admin") roleText = " (Admin)";
    else if (currentWorker.role === "manager") roleText = " (Manager)";
    else if (currentWorker.role === "reception") roleText = " (Reception)";
    badge.textContent = "👤 " + currentWorker.name + roleText;

    if (currentWorker.role === "cleaner") {
      const onShift = isCurrentWorkerOnShift();
      if (onShift) {
        shiftContainer.innerHTML = `
          <button class="shift-btn active">✔ On shift</button>
          <span class="shift-end-link" onclick="endShift()">End shift</span>
        `;
      } else {
        shiftContainer.innerHTML = `
          <button class="shift-btn start" onclick="startShift()">🟢 Start shift</button>
        `;
      }
    } else if (currentWorker.role === "manager" || currentWorker.role === "admin") {
      shiftContainer.innerHTML = `
        <span class="attendance-badge">👥 On shift: ${todayAttendance.length}</span>
      `;
    } else {
      shiftContainer.innerHTML = "";
    }
  } else {
    badge.textContent = "👤 Not signed in";
    shiftContainer.innerHTML = "";
  }
}

function getTodayString() {
  const d = new Date();
  return d.toISOString().split("T")[0];
}

function checkDateRollover() {
  const today = getTodayString();
  if (today !== lastActiveDate) {
    console.log("Midnight transition: new day clean slate!");
    lastActiveDate = today;
    updateDateDisplay();
    reconnectAndSync();
  }
}

/* =====================================================
   WAKE-UP RESILIENCE & PERIODIC AUTO-SYNC
   ===================================================== */
async function handleWakeUp() {
  if (document.visibilityState === "visible") {
    console.log("App resumed from background, checking connection...");
    setConnectionStatus("reconnecting");
    checkDateRollover();
    await reconnectAndSync();
  }
}

document.addEventListener("visibilitychange", handleWakeUp);
window.addEventListener("focus", handleWakeUp);
setInterval(checkDateRollover, 30000);

// Polling fallback every 6 seconds when screen is active: guarantees sync even if WebSocket hiccups!
setInterval(async () => {
  if (document.visibilityState === "visible") {
    await silentSyncRooms();
  }
}, 6000);

async function silentSyncRooms() {
  try {
    let res = await window.supabaseClient
      .from("rooms")
      .select("room_number,status,note");

    if (res.error) {
      res = await window.supabaseClient.from("rooms").select("room_number,status");
    }

    if (!res.error && res.data) {
      let changed = false;
      res.data.forEach(room => {
        const current = states[room.room_number] || "empty";
        const incoming = (room.status && room.status !== "empty") ? room.status : "empty";
        const currentNote = notes[room.room_number] || "";
        const incomingNote = room.note || "";

        if (current !== incoming || currentNote !== incomingNote) {
          changed = true;
          if (incoming === "empty") delete states[room.room_number];
          else states[room.room_number] = incoming;
          
          if (incomingNote) notes[room.room_number] = incomingNote;
          else delete notes[room.room_number];

          updateRoomElement(room.room_number, incoming, incomingNote);
        }
      });
      if (changed) updateSummary();
      setConnectionStatus("online");
    }
  } catch(e) {
    // silent
  }
}

async function reconnectAndSync() {
  setConnectionStatus("reconnecting");
  try {
    await Promise.all([
      loadWorkers(),
      loadAttendance(),
      loadAssignments(),
      loadRooms()
    ]);
    render();
    setConnectionStatus("online");
  } catch (err) {
    console.warn("Error reconnecting after wake-up:", err);
    setConnectionStatus("offline");
  }
}

async function assignCorridor(corridorName, workerName) {

function isMyCorridor(corridorName) {
  if (!currentWorker) return false;
  return corridorAssignments[corridorName] === currentWorker.name;
}

function isManagerOrAdmin() {
  return currentWorker && (currentWorker.role === "manager" || currentWorker.role === "admin");
}

/* =====================================================
   LOAD ROOMS FROM SUPABASE
   ===================================================== */
async function loadRooms() {
  let res = await window.supabaseClient
    .from("rooms")
    .select("room_number,status,note");

  if (res.error) {
    res = await window.supabaseClient.from("rooms").select("room_number,status");
  }

  if (res.error) {
    console.error("Supabase error:", res.error);
    setConnectionStatus("offline");
    return;
  }

  states = {};
  notes = {};
  res.data.forEach(room => {
    if (room.status && room.status !== "empty") {
      states[room.room_number] = room.status;
    }
    if (room.note) {
      notes[room.room_number] = room.note;
    }
  });
  setConnectionStatus("online");
}

/* =====================================================
   UPDATE ONE ROOM & NOTES
   ===================================================== */
async function updateRoom(room, status) {
  const previousStatus = states[room] || "empty";

  if (status === "empty") {
    delete states[room];
  } else {
    states[room] = status;
  }
  updateRoomElement(room, status, notes[room]);

  broadcastEvent("room_change", { room: room, status: status, note: notes[room] || "" });

  const { error } = await window.supabaseClient
    .from("rooms")
    .update({
      status: status,
      updated_at: new Date().toISOString()
    })
    .eq("room_number", room);

  if (error) {
    console.error("Update error:", error);
    if (previousStatus === "empty") delete states[room];
    else states[room] = previousStatus;
    updateRoomElement(room, previousStatus, notes[room]);
    broadcastEvent("room_change", { room: room, status: previousStatus, note: notes[room] || "" });
    alert("Error: Could not save room change to database.");
    return false;
  }

  return true;
}

async function setRoomNote(tag, event) {
  if (event) event.stopPropagation();
  if (currentMenuRoom === null) return;

  const room = currentMenuRoom;
  const previousNote = notes[room] || "";

  if (!tag) delete notes[room];
  else notes[room] = tag;

  updateRoomElement(room, states[room] || "empty", tag);
  closeMenu();

  broadcastEvent("room_change", { room: room, status: states[room] || "empty", note: tag });

  // Update in DB (gracefully skips if note column not yet created in Supabase)
  const { error } = await window.supabaseClient
    .from("rooms")
    .update({
      note: tag,
      updated_at: new Date().toISOString()
    })
    .eq("room_number", room);

  if (error) {
    console.warn("Could not save note to database (column might not be created yet):", error);
  }
}

function getNoteIcon(tag) {
  if (tag === "dnd") return "⛔";
  if (tag === "issue") return "⚠️";
  if (tag === "cot") return "👶";
  return "";
}

function updateRoomElement(room, status, noteTag) {
  const el = document.getElementById("room-" + room);
  if (el) {
    el.className = "room " + (status || "empty");
    const tagIcon = getNoteIcon(noteTag !== undefined ? noteTag : notes[room]);
    el.innerHTML = `<span>${room}</span>${tagIcon ? `<span class="room-tag-icon">${tagIcon}</span>` : ''}`;
  }
  updateSummary();
}

/* =====================================================
   REALTIME: BROADCAST + POSTGRES CHANGES
   ===================================================== */
function setupRealtime() {
  if (liveChannel) {
    liveChannel.unsubscribe();
  }

  liveChannel = window.supabaseClient
    .channel("rooms-live-channel", {
      config: { broadcast: { self: false } }
    })
    .on("broadcast", { event: "room_change" }, (payload) => {
      const { room, status, note } = payload.payload;
      const oldStatus = states[room] || "empty";

      if (status === "empty") delete states[room];
      else states[room] = status;

      if (note) notes[room] = note;
      else delete notes[room];

      if (status === "checkout" && oldStatus !== "checkout") {
        handleCheckoutNotification(room);
      }
      updateRoomElement(room, status, note);
    })
    .on("broadcast", { event: "attendance_change" }, async () => {
      await loadAttendance();
      render();
    })
    .on("broadcast", { event: "assignment_change" }, async () => {
      await loadAssignments();
      render();
    })
    .on(
      "postgres_changes",
      { event: "*", schema: "public", table: "rooms" },
      function(payload) {
        if (payload.eventType === "DELETE") {
          const room = payload.old.room_number;
          delete states[room];
          delete notes[room];
          updateRoomElement(room, "empty", "");
        } else {
          const room = payload.new.room_number;
          const newStatus = payload.new.status;
          const newNote = payload.new.note || "";
          const oldStatus = states[room] || "empty";

          if (newStatus === "empty") delete states[room];
          else states[room] = newStatus;

          if (newNote) notes[room] = newNote;
          else delete notes[room];

          if (newStatus === "checkout" && oldStatus !== "checkout") {
            handleCheckoutNotification(room);
          }
          updateRoomElement(room, newStatus, newNote);
        }
      }
    )
    .subscribe((status) => {
      if (status === "SUBSCRIBED") {
        setConnectionStatus("online");
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
        setConnectionStatus("reconnecting");
      }
    });
}

function broadcastEvent(eventName, payload) {
  if (liveChannel) {
    liveChannel.send({
      type: "broadcast",
      event: eventName,
      payload: payload
    });
  }
}

function handleCheckoutNotification(room) {
  let targetSection = null;
  for (const sec of sections) {
    if (sec.rooms.includes(room)) {
      targetSection = sec;
      break;
    }
  }

  if (!targetSection) return;

  const assignedWorker = corridorAssignments[targetSection.name];
  const isMine = currentWorker && (assignedWorker === currentWorker.name);
  const isPrivileged = currentWorker && (currentWorker.role === "manager" || currentWorker.role === "admin" || currentWorker.role === "reception");

  if (isMine || isPrivileged) {
    playCheckoutChime();
    showToast(`Room ${room} - Check out`);

    if ("Notification" in window && Notification.permission === "granted") {
      new Notification(`Room ${room} - Check out`, {
        body: `Room ${room} is ready for cleaning`,
        icon: "icon-192.png"
      });
    }
  }
}

document.addEventListener("click", function requestNotifOnce() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
  document.removeEventListener("click", requestNotifOnce);
}, { once: true });

/* =====================================================
   CLEAN ALL CORRIDOR
   ===================================================== */
async function finishCorridor(sectionName) {
  const section = sections.find(s => s.name === sectionName);
  if (!section) return;

  const confirmed = confirm(
    `Set all ${section.rooms.length} rooms in ${sectionName} to Clean room?`
  );

  if (!confirmed) return;

  section.rooms.forEach(room => {
    states[room] = "done";
    updateRoomElement(room, "done");
    broadcastEvent("room_change", { room: room, status: "done" });
  });

  const { error } = await window.supabaseClient
    .from("rooms")
    .update({
      status: "done",
      updated_at: new Date().toISOString()
    })
    .in("room_number", section.rooms);

  if (error) {
    console.error("Clean corridor error:", error);
    alert("Error saving corridor status.");
  }
}

/* =====================================================
   RENDER
   ===================================================== */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const canManage = isManagerOrAdmin();

  sections.forEach(section => {
    const sectionDiv = document.createElement("div");
    sectionDiv.className = "section";

    const headerDiv = document.createElement("div");
    headerDiv.className = "section-header";

    const title = document.createElement("div");
    title.className = "section-title";
    title.textContent = section.name;
    headerDiv.appendChild(title);

    const actionsDiv = document.createElement("div");
    actionsDiv.className = "section-actions";

    const assignedName = corridorAssignments[section.name] || "";
    const isMine = isMyCorridor(section.name);

    if (canManage) {
      const select = document.createElement("select");
      select.className = "assign-select";

      let optionsHtml = `<option value="">-- Unassigned --</option>`;

      const activeWorkers = allWorkers.filter(w => (w.role === "cleaner" || w.role === "manager") && todayAttendance.includes(w.name));
      const otherWorkers = allWorkers.filter(w => (w.role === "cleaner" || w.role === "manager") && !todayAttendance.includes(w.name));

      if (activeWorkers.length > 0) {
        optionsHtml += `<optgroup label="🟢 On shift today (${activeWorkers.length})">`;
        activeWorkers.forEach(w => {
          optionsHtml += `<option value="${w.name}" ${w.name === assignedName ? "selected" : ""}>🟢 ${w.name}</option>`;
        });
        optionsHtml += `</optgroup>`;
      }

      if (otherWorkers.length > 0) {
        optionsHtml += `<optgroup label="⚪ Others (off shift)">`;
        otherWorkers.forEach(w => {
          optionsHtml += `<option value="${w.name}" ${w.name === assignedName ? "selected" : ""}>${w.name}</option>`;
        });
        optionsHtml += `</optgroup>`;
      }

      select.innerHTML = optionsHtml;
      select.addEventListener("change", (e) => {
        assignCorridor(section.name, e.target.value);
      });
      actionsDiv.appendChild(select);
    } else {
      const badge = document.createElement("span");
      badge.className = "assigned-badge" + (isMine ? " my-corridor" : "");
      badge.textContent = assignedName ? (isMine ? `👤 ${assignedName} (Mine)` : `👤 ${assignedName}`) : "— unassigned";
      actionsDiv.appendChild(badge);
    }

    if (isMine || canManage) {
      const finishBtn = document.createElement("button");
      finishBtn.className = "btn-finish-corridor";
      finishBtn.textContent = "✔ Clean all";
      finishBtn.onclick = () => finishCorridor(section.name);
      actionsDiv.appendChild(finishBtn);
    }

    headerDiv.appendChild(actionsDiv);
    sectionDiv.appendChild(headerDiv);

    const roomsDiv = document.createElement("div");
    roomsDiv.className = "rooms";

    section.rooms.forEach(room => {
      const roomDiv = document.createElement("div");
      roomDiv.id = "room-" + room;
      roomDiv.className = "room " + (states[room] || "empty");
      
      const tagIcon = getNoteIcon(notes[room]);
      roomDiv.innerHTML = `<span>${room}</span>${tagIcon ? `<span class="room-tag-icon">${tagIcon}</span>` : ''}`;

      roomDiv.addEventListener("click", function(event) {
        event.stopPropagation();
        openMenu(room, roomDiv);
      });

      roomsDiv.appendChild(roomDiv);
    });

    sectionDiv.appendChild(roomsDiv);
    app.appendChild(sectionDiv);
  });

  updateSummary();

  if (!initialRenderDone) {
    initialRenderDone = true;
    restoreScrollPosition();
  }
}

        👶 Cot
      </button>
      <button class="clear" onclick="setRoomNote('', event)">
        Clear
      </button>
    </div>
  `;

  menu.innerHTML = buttonsHtml;

  menu.style.display = "block";
  menu.style.visibility = "hidden";

  positionMenu();

  menu.style.visibility = "visible";
}

/* =====================================================
   POSITION MENU
   ===================================================== */
function positionMenu() {
  if (!currentMenuRoomElement) return;

  const menu = document.getElementById("globalMenu");
  const room = currentMenuRoomElement.getBoundingClientRect();
  const menuWidth = menu.offsetWidth;
  const menuHeight = menu.offsetHeight;

  let left = room.left + (room.width / 2) - (menuWidth / 2);
  left = Math.max(5, Math.min(left, window.innerWidth - menuWidth - 5));

  const spaceBelow = window.innerHeight - room.bottom - 8;
  const spaceAbove = room.top - 8;

  let top;
  if (spaceBelow >= menuHeight || spaceBelow >= spaceAbove) {
    top = room.bottom + 6;
  } else {
    top = room.top - menuHeight - 6;
  }

  top = Math.max(5, Math.min(top, window.innerHeight - menuHeight - 5));

  menu.style.left = left + "px";
  menu.style.top = top + "px";
  menu.style.maxHeight = Math.max(80, window.innerHeight - 10) + "px";
}

/* =====================================================
   SELECT STATUS
   ===================================================== */
async function selectStatus(status, event) {
  if (event) event.stopPropagation();
  if (currentMenuRoom === null) return;

  const room = currentMenuRoom;
  closeMenu();
  await updateRoom(room, status);
}

/* =====================================================
   CLOSE MENU
   ===================================================== */
function closeMenu() {
  const menu = document.getElementById("globalMenu");
  menu.style.display = "none";
  menu.style.visibility = "hidden";
  currentMenuRoom = null;
  currentMenuRoomElement = null;
}

/* =====================================================
   CLICK OUTSIDE / SCROLL
   ===================================================== */
document.addEventListener("click", function(event) {
  const menu = document.getElementById("globalMenu");
  if (!menu.contains(event.target)) {
    closeMenu();
  }
});

window.addEventListener("scroll", function() {
  if (currentMenuRoom !== null) {
    positionMenu();
  }
}, true);

window.addEventListener("resize", function() {
  if (currentMenuRoom !== null) {
    positionMenu();
  }
});

/* =====================================================
   HISTORY MODAL LOGIC (LAST 5 DAYS)
   ===================================================== */
let selectedHistoryDate = getTodayString();

function getLast5Dates() {
  const dates = [];
  for (let i = 0; i < 5; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().split("T")[0];
    let label = "";
    if (i === 0) label = "Today";
    else if (i === 1) label = "Yesterday";
    else {
      label = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    }
    dates.push({ dateStr, label });
  }
  return dates;
}

function openHistoryModal() {
  const modal = document.getElementById("historyModal");
  modal.style.display = "flex";
  renderHistoryTabs();
  loadHistoryForDate(selectedHistoryDate);
}

function closeHistoryModal() {
  document.getElementById("historyModal").style.display = "none";
}

function renderHistoryTabs() {
  const tabsContainer = document.getElementById("historyTabs");
  const dates = getLast5Dates();

  tabsContainer.innerHTML = dates.map(d => `
    <button class="history-tab ${d.dateStr === selectedHistoryDate ? 'active' : ''}" onclick="selectHistoryDate('${d.dateStr}')">
      ${d.label}
    </button>
  `).join("");
}

function selectHistoryDate(dateStr) {
  selectedHistoryDate = dateStr;
  renderHistoryTabs();
  loadHistoryForDate(dateStr);
}

async function loadHistoryForDate(dateStr) {
  const content = document.getElementById("historyContent");
  content.innerHTML = `<p style="color:#777;">Loading data for ${dateStr}...</p>`;

  try {
    const [assignRes, attRes] = await Promise.all([
      window.supabaseClient
        .from("corridor_assignments")
        .select("corridor_name,worker_name,updated_at")
        .eq("date", dateStr),
      window.supabaseClient
        .from("worker_attendance")
        .select("worker_name,logged_in_at")
        .eq("date", dateStr)
    ]);

    const assignments = assignRes.data || [];
    const attendance = attRes.data || [];

    let html = ``;

    if (attendance.length > 0) {
      html += `
        <div style="margin-bottom: 12px; padding: 8px 10px; background: #f0f7ff; border-radius: 8px; font-size: 12px;">
          <strong>Staff on shift (${attendance.length}):</strong> ${attendance.map(a => a.worker_name).join(", ")}
        </div>
      `;
    }

    if (assignments.length === 0) {
      html += `<p style="color: #888; text-align: center; margin: 20px 0;">No corridor assignments recorded for this day.</p>`;
    } else {
      html += `<div style="font-weight: bold; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; color: #666;">Corridor Assignments:</div>`;
      sections.forEach(sec => {
        const item = assignments.find(a => a.corridor_name === sec.name);
        html += `
          <div class="history-corridor-item">
            <span class="history-corridor-name">${sec.name}</span>
            <span class="history-worker-name">${item && item.worker_name ? `👤 ${item.worker_name}` : '<span style="color:#999;font-weight:normal;">— unassigned</span>'}</span>
          </div>
        `;
      });
    }

    content.innerHTML = html;
  } catch (err) {
    content.innerHTML = `<p style="color: #c00;">Failed to load history.</p>`;
  }
}

/* =====================================================
   OCCUPIED ALL (OPTIMIZED FAST BATCH + BROADCAST)
   ===================================================== */
async function occupiedAll() {
  const confirmed = confirm(
    "Set ALL rooms to Occupied?\n\nThis will change the status of every room."
  );

  if (!confirmed) return;

  sections.forEach(section => {
    section.rooms.forEach(room => {
      states[room] = "occupied";
      updateRoomElement(room, "occupied");
      broadcastEvent("room_change", { room: room, status: "occupied", note: notes[room] || "" });
    });
  });

  const { error } = await window.supabaseClient
    .from("rooms")
    .update({
      status: "occupied",
      updated_at: new Date().toISOString()
    })
    .neq("room_number", 0);

  if (error) {
    console.error("Occupied all error:", error);
    alert("Could not set all rooms to occupied.");
  }
}

/* =====================================================
   RESET ALL (OPTIMIZED FAST BATCH + BROADCAST)
   ===================================================== */
async function resetAll() {
  const confirmed = confirm(
    "Reset ALL room statuses?\n\nThis cannot be undone."
  );

  if (!confirmed) return;

  sections.forEach(section => {
    section.rooms.forEach(room => {
      delete states[room];
      delete notes[room];
      updateRoomElement(room, "empty", "");
      broadcastEvent("room_change", { room: room, status: "empty", note: "" });
    });
  });

  const { error } = await window.supabaseClient
    .from("rooms")
    .update({
      status: "empty",
      note: "",
      updated_at: new Date().toISOString()
    })
    .neq("room_number", 0);

  if (error) {
    console.error("Reset error:", error);
    alert("Could not reset the rooms.");
  }
}

/* =====================================================
   SUMMARY
   ===================================================== */
function updateSummary() {
  let total = 0;
  let done = 0;
  let checkout = 0;
  let cleaning = 0;
  let stayover = 0;
  let occupied = 0;

  sections.forEach(section => {
    section.rooms.forEach(room => {
      total++;
      const st = states[room];
      if (st === "done") done++;
      else if (st === "checkout") checkout++;
      else if (st === "cleaning") cleaning++;
      else if (st === "stayover") stayover++;
      else if (st === "occupied") occupied++;
    });
  });

  document.getElementById("summary").innerHTML = `
    <span><strong>${total}</strong> rooms</span>
    <span>🔴 ${occupied}</span>
    <span>🟢 ${checkout}</span>
    <span>🟠 ${cleaning}</span>
    <span>🟣 ${stayover}</span>
    <span>🔵 ${done}</span>
  `;
}

  document.getElementById("date").textContent = new Date().toLocaleDateString(
    "en-GB",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );
}
